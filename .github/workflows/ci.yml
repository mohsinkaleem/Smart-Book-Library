name: CI

# Lint and the test suite were both green at one point and nothing kept them
# there: `npm run lint` had accumulated 11 errors, including two
# `rules-of-hooks` violations, because no one ran it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # The `embed` extra pulls sentence-transformers and torch — hundreds of
        # megabytes for a suite that never encodes anything. `SimilarityEngine`
        # degrades cleanly without it.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - run: pytest -q

  frontend:
    name: tsc + eslint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `tsc -b` was already clean while eslint was not, which is exactly why
      # both run here.
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build
